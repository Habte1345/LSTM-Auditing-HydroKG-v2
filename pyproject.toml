[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrokg"
version = "2.0.0"
description = "Auditing LSTM streamflow predictions against hydrologic rules with a knowledge graph (RDF, SHACL, PROV-O)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (HydroKG) and Apache-2.0 (vendored LSTM code)"}
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.0", "h5py>=3.8",
  "numba>=0.57", "tqdm>=4.65", "pyyaml>=6.0", "rdflib>=7.0", "pyshacl>=0.25", "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
hydrokg = "hydrokg.pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["hydrokg*"]

[tool.setuptools.package-data]
"hydrokg.kg" = ["resources/*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
